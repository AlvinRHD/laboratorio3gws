events {
    worker_connections 1024;
}

http {

    # Configuracion de cache
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=speed_cache:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    # Compresion Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript;

    # Registro para monitoreo
    log_format metricas 'status=$status cache=$upstream_cache_status '
                        'tiempo=$request_time backend=$upstream_addr';

    access_log /var/log/nginx/access.log metricas;

    # Balanceo de carga
    upstream backends {
        least_conn;

        server backend1:8000 max_fails=3 fail_timeout=30s;
        server backend2:8000 max_fails=3 fail_timeout=30s;
        server backend3:8000 max_fails=3 fail_timeout=30s;
        server backend4:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        location = /nginx_status {
            stub_status;
            access_log off;
        }

        location / {
            proxy_pass http://backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache de 30 segundos
            proxy_cache speed_cache;
            proxy_cache_valid 200 30s;
            proxy_cache_lock on;

            # Permitir pruebas sin cache
            proxy_cache_bypass $arg_nocache;
            proxy_no_cache $arg_nocache;

            # Mostrar estado de cache
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
