services:

  backend1:
    build: ./backends
    environment:
      BACKEND_NAME: backend1
      DELAY_MS: 50
    restart: unless-stopped

  backend2:
    build: ./backends
    environment:
      BACKEND_NAME: backend2
      DELAY_MS: 50
    restart: unless-stopped

  backend3:
    build: ./backends
    environment:
      BACKEND_NAME: backend3
      DELAY_MS: 50
    restart: unless-stopped

  backend4:
    build: ./backends
    environment:
      BACKEND_NAME: backend4
      DELAY_MS: 50
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    restart: unless-stopped
